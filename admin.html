<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 · 만조 Investment</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #F7F5F0; --bg-card: #FFFFFF; --bg-hero: #EEE9DF;
    --text-primary: #1C1C2E; --text-secondary: #5A5A72; --text-muted: #9494A8;
    --accent: #4A6FA5; --accent-hover: #3A5A90; --accent-light: #EBF0F9;
    --border: #E5E0D8; --danger: #C0392B; --danger-light: #FBEAE8;
    --font: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text-primary); line-height: 1.6; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
  .back-link { display: inline-block; font-size: 13px; color: var(--text-muted); text-decoration: none; margin-bottom: 14px; }
  .back-link:hover { color: var(--accent); }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 13px; margin: 0 0 28px; }
  .gate, .loading, .error { max-width: 420px; margin: 80px auto; text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 40px 28px; }
  .gate a, .error a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar input[type="search"] { flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 20px; font-family: var(--font); font-size: 14px; outline: none; background: #fff; }
  .toolbar input[type="search"]:focus { border-color: var(--accent); }
  .toolbar select { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 20px; font-family: var(--font); font-size: 13px; background: #fff; color: var(--text-secondary); }
  .count-badge { font-size: 12.5px; color: var(--text-muted); background: var(--accent-light); padding: 4px 12px; border-radius: 12px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  thead th { text-align: left; font-size: 12px; color: var(--text-muted); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--accent); }
  thead th.sorted { color: var(--accent); }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--accent-light); }
  .nickname { font-weight: 700; }
  .email { color: var(--text-secondary); font-size: 12.5px; }
  .provider-tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: var(--bg-hero); color: var(--text-secondary); margin-left: 6px; }
  .stat-num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-muted); }
  .del-btn { background: none; border: 1.5px solid var(--danger); color: var(--danger); border-radius: 14px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: background .15s, color .15s; }
  .del-btn:hover { background: var(--danger); color: #fff; }
  .del-btn:disabled { opacity: .5; cursor: not-allowed; }
  .empty { text-align: center; padding: 40px; color: var(--text-muted); }

  .section-h2 { font-size: 16px; font-weight: 800; margin: 0 0 14px; }
  .status-section { margin-bottom: 36px; }
  .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .status-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .status-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .status-card-title { font-size: 14px; font-weight: 700; }
  .status-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
  .status-badge.ok { background: #E4F5EA; color: #1E7A46; }
  .status-badge.warn { background: #FFF3DE; color: #B4740E; }
  .status-badge.error { background: var(--danger-light); color: var(--danger); }
  .status-badge.na { background: var(--bg-hero); color: var(--text-muted); }
  .status-flow { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 10px; word-break: keep-all; }
  .status-flow b { color: var(--text-secondary); font-weight: 600; }
  .status-meta { font-size: 12.5px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 3px; }
  .status-issues { margin: 8px 0 0; padding: 0; list-style: none; font-size: 11.5px; color: var(--danger); }
  .status-issues li { margin-top: 3px; }
  .status-checked-at { font-size: 11.5px; color: var(--text-muted); margin: -8px 0 16px; }
  .heatmap-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .heatmap-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .heatmap-row:last-child { margin-bottom: 0; }
  .heatmap-label { width: 120px; flex-shrink: 0; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .heatmap-cells { display: flex; gap: 6px; }
  .heatmap-cell { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #fff; border: 1.5px dashed var(--border); color: var(--text-muted); }
  .heatmap-cell.filled { background: #2E9E5B; border: 1.5px solid #2E9E5B; color: #fff; }

  .positions-section { margin-bottom: 36px; }
  .ret-pos { color: #1E7A46; font-weight: 700; }
  .ret-neg { color: var(--danger); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">확인 중입니다...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://nxvpipgvcrfkujbvjjak.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54dnBpcGd2Y3Jma3VqYnZqamFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MTA5NTAsImV4cCI6MjA5ODA4Njk1MH0.QXJs2t980WJ_tiXFsFFUWubftHb30r5IpoA1-09qBPk';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const app = document.getElementById('app');
  let allUsers = [];
  let statusData = null;
  let positionsData = [];
  let sortKey = 'createdAt';
  let sortDir = 'desc';

  function showGate() {
    app.innerHTML =
      '<div class="gate">' +
      '<h1 style="margin-bottom:10px">🔒 관리자 전용</h1>' +
      '<p class="sub" style="margin-bottom:20px">회장님 계정으로 로그인해야 볼 수 있는 페이지입니다.</p>' +
      '<a href="/">메인 페이지에서 로그인하러 가기 →</a>' +
      '</div>';
  }

  function showError(msg) {
    app.innerHTML =
      '<div class="error">' +
      '<h1 style="margin-bottom:10px">불러오지 못했습니다</h1>' +
      '<p class="sub">' + msg + '</p>' +
      '<a href="javascript:location.reload()">다시 시도</a>' +
      '&nbsp;·&nbsp;<a href="/">메인으로</a>' +
      '</div>';
  }

  function fmtDate(iso) {
    if (!iso) return '<span class="muted">-</span>';
    const d = new Date(iso);
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0')
      + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function fmtDuration(ms) {
    if (!ms) return '<span class="muted">0분</span>';
    const totalMin = Math.round(ms / 60000);
    if (totalMin < 60) return totalMin + '분';
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h + '시간 ' + m + '분';
  }

  async function loadDashboard() {
    const session = (await sb.auth.getSession()).data.session;
    if (!session) { showGate(); return; }

    const authHeader = { Authorization: 'Bearer ' + session.access_token };
    const [usersRes, statusRes, positionsRes] = await Promise.all([
      fetch('/api/admin-users', { headers: authHeader }),
      fetch('/api/admin-status', { headers: authHeader }),
      fetch('/api/holdings', { headers: authHeader }),
    ]);
    if (usersRes.status === 403) { showGate(); return; }
    if (!usersRes.ok) { showError('회원 목록을 불러오는 중 오류가 발생했습니다 (' + usersRes.status + ').'); return; }

    const data = await usersRes.json();
    allUsers = data.users || [];
    // 현황 대시보드/포지션 현황은 회원 목록보다 덜 치명적이라, 실패해도 페이지 전체를 막지 않고
    // 그 섹션에만 오류를 표시한다(회원 관리 자체는 계속 쓸 수 있어야 하므로).
    statusData = statusRes.ok ? await statusRes.json() : { error: '현황을 불러오지 못했습니다 (' + statusRes.status + ').' };
    positionsData = positionsRes.ok ? (await positionsRes.json()).positions || [] : [];
    renderApp();
  }

  function renderApp() {
    app.innerHTML =
      '<a href="/" class="back-link">← 메인 페이지로</a>' +
      '<h1>회원 관리</h1>' +
      '<p class="sub">가입한 회원 목록과 사이트 안 활동을 확인하고, 필요하면 강제 탈퇴시킬 수 있습니다.</p>' +
      '<div class="status-section" id="status-section"></div>' +
      '<div class="positions-section" id="positions-section"></div>' +
      '<h2 class="section-h2">회원 목록</h2>' +
      '<div class="toolbar">' +
      '  <input type="search" id="search" placeholder="이메일 또는 닉네임 검색">' +
      '  <span class="count-badge" id="count-badge"></span>' +
      '</div>' +
      '<div id="table-wrap"></div>';
    document.getElementById('search').addEventListener('input', renderTable);
    renderStatus();
    renderPositions();
    renderTable();
  }

  // ── 자동화 현황 대시보드 ──────────────────────────────────────────────────
  const STATUS_LABEL = { ok: '🟢 정상', warn: '🟡 지연', error: '🔴 확인 필요', na: '— 실시간' };
  const WEEKDAY_KR = ['일', '월', '화', '수', '목', '금', '토'];

  function fmtShortDate(iso) {
    if (!iso) return '<span class="muted">데이터 없음</span>';
    return iso.slice(5).replace('-', '/');
  }

  function fmtDaysAgo(days) {
    if (days === null || days === undefined) return '';
    if (days === 0) return '(오늘)';
    if (days < 0) return '(예정)';
    return '(' + days + '일 전)';
  }

  function renderStatus() {
    const el = document.getElementById('status-section');
    if (!el) return;

    if (!statusData) {
      el.innerHTML = '<p class="sub">현황을 불러오는 중입니다...</p>';
      return;
    }
    if (statusData.error) {
      el.innerHTML = '<p class="sub" style="color:var(--danger)">' + statusData.error + '</p>';
      return;
    }

    const cards = statusData.pipelines.map(p => {
      const issuesHtml = p.issues && p.issues.length
        ? '<ul class="status-issues">' + p.issues.map(i => '<li>⚠ ' + i + '</li>').join('') + '</ul>'
        : '';
      const metaHtml = p.status === 'na'
        ? '<div class="status-meta"><span>저장하지 않고 매번 새로 불러옵니다</span></div>'
        : '<div class="status-meta">' +
          '<span>최신: ' + fmtShortDate(p.latestDate) + ' ' + fmtDaysAgo(p.daysSinceLatest) + '</span>' +
          (p.expectedRowCount ? '<span>건수: ' + (p.rowCount == null ? '-' : p.rowCount) + ' / ' + p.expectedRowCount + '</span>' : '') +
          (p.lastUpdatedAt ? '<span>DB 반영: ' + fmtDate(p.lastUpdatedAt) + '</span>' : '') +
          '</div>';

      return '<div class="status-card">' +
        '<div class="status-card-head">' +
        '<span class="status-card-title">' + p.label + '</span>' +
        '<span class="status-badge ' + p.status + '">' + STATUS_LABEL[p.status] + '</span>' +
        '</div>' +
        '<div class="status-flow"><b>출처</b> ' + p.source + ' → <b>주기</b> ' + p.schedule + ' → <b>저장</b> ' + p.table + '</div>' +
        metaHtml +
        issuesHtml +
        '</div>';
    }).join('');

    // 최근 7일 히트맵 (오늘 포함, 과거→오늘 순)
    const today = statusData.today;
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    const heatRows = [
      ['상승률 Top10', statusData.recent7Days.gainers],
      ['거래대금 Top10', statusData.recent7Days.volume],
      ['마켓 스코프', statusData.recent7Days.marketScope],
    ].map(([label, dateList]) => {
      const set = new Set(dateList);
      const cells = days.map(d => {
        const wd = WEEKDAY_KR[new Date(d + 'T00:00:00Z').getUTCDay()];
        const filled = set.has(d);
        return '<span class="heatmap-cell' + (filled ? ' filled' : '') + '" title="' + d + (filled ? ' 수신됨' : ' 없음') + '">' + wd + '</span>';
      }).join('');
      return '<div class="heatmap-row"><span class="heatmap-label">' + label + '</span><div class="heatmap-cells">' + cells + '</div></div>';
    }).join('');

    el.innerHTML =
      '<h2 class="section-h2">자동화 현황</h2>' +
      '<p class="status-checked-at">확인 시각: ' + fmtDate(statusData.checkedAt) + ' · 상태는 최근 3일 이내를 기준으로 판단합니다(주말·휴장일은 정상적으로 비어있을 수 있습니다)</p>' +
      '<div class="status-grid">' + cards + '</div>' +
      '<div class="heatmap-wrap"><div class="status-card-title" style="margin-bottom:12px">최근 7일 수신 현황</div>' + heatRows + '</div>';
  }

  // ── 보유 포지션 현황 (읽기 전용, stock_screener.trend_positions) ────────────
  // PC의 positions.py가 관리하는 진짜 추세추종 포지션 원장을 그대로 보여준다.
  // 새 포지션 등록/청산은 PC의 enter_position.py/daily_check.py가 담당한다(시세
  // 데이터로 align_days/rs120 등을 계산해야 하므로 사이트에서 직접 입력하지 않는다).
  function fmtPct(x) {
    if (x === null || x === undefined) return '<span class="muted">-</span>';
    const pct = (x * 100).toFixed(1) + '%';
    return '<span class="' + (x >= 0 ? 'ret-pos' : 'ret-neg') + '">' + (x >= 0 ? '+' : '') + pct + '</span>';
  }

  function fmtPrice(n) {
    if (n === null || n === undefined) return '<span class="muted">-</span>';
    return Number(n).toLocaleString('ko-KR') + '원';
  }

  function openPositionRow(p) {
    const unreal = (p.last_price && p.entry_price) ? (p.last_price - p.entry_price) / p.entry_price : null;
    return '<tr>' +
      '<td><b>' + (p.stock_name || '-') + '</b><div class="email">' + p.stock_code + (p.market_type ? ' · ' + p.market_type : '') + '</div></td>' +
      '<td class="muted">' + (p.entry_date || '-') + '</td>' +
      '<td class="stat-num">' + fmtPrice(p.entry_price) + '</td>' +
      '<td class="stat-num">' + (p.remaining_qty != null ? Number(p.remaining_qty).toLocaleString('ko-KR') : '-') + '</td>' +
      '<td class="stat-num">' + fmtPrice(p.last_price) + '</td>' +
      '<td class="stat-num">' + fmtPct(unreal) + '</td>' +
      '<td class="stat-num">' + (p.align_days != null ? p.align_days + '일' : '-') + '</td>' +
      '<td class="muted">' + (p.last_checked || '-') + '</td>' +
      '<td>' + (p.note || '<span class="muted">-</span>') + '</td>' +
      '</tr>';
  }

  function closedPositionRow(p) {
    return '<tr>' +
      '<td><b>' + (p.stock_name || '-') + '</b><div class="email">' + p.stock_code + (p.market_type ? ' · ' + p.market_type : '') + '</div></td>' +
      '<td class="muted">' + (p.entry_date || '-') + ' ~ ' + (p.exit_date || '-') + '</td>' +
      '<td class="stat-num">' + fmtPrice(p.entry_price) + ' → ' + fmtPrice(p.exit_price) + '</td>' +
      '<td class="stat-num">' + fmtPct(p.ret) + '</td>' +
      '<td class="muted">' + (p.exit_reason || '-') + '</td>' +
      '<td>' + (p.note || '<span class="muted">-</span>') + '</td>' +
      '</tr>';
  }

  function renderPositions() {
    const el = document.getElementById('positions-section');
    if (!el) return;

    const open = positionsData.filter(p => p.status === 'open');
    const closed = positionsData.filter(p => p.status !== 'open');

    const openHtml = open.length
      ? '<table><thead><tr><th>종목</th><th>진입일</th><th>진입가</th><th>잔여수량</th><th>현재가</th><th>평가손익</th><th>정배열</th><th>최근확인</th><th>메모</th></tr></thead><tbody>' +
        open.map(openPositionRow).join('') + '</tbody></table>'
      : '<div class="empty">현재 보유(진행) 중인 포지션이 없습니다.</div>';

    const closedHtml = closed.length
      ? '<details style="margin-top:14px"><summary style="cursor:pointer;font-size:13px;color:var(--text-muted)">청산 완료 ' + closed.length + '건 보기</summary>' +
        '<table style="margin-top:10px"><thead><tr><th>종목</th><th>진입~청산일</th><th>진입가→청산가</th><th>손익률</th><th>청산사유</th><th>메모</th></tr></thead><tbody>' +
        closed.map(closedPositionRow).join('') + '</tbody></table></details>'
      : '';

    el.innerHTML =
      '<h2 class="section-h2">보유 포지션 현황</h2>' +
      '<p class="sub" style="margin-top:-20px">stock_screener(PC)의 추세추종 포지션 원장을 그대로 보여줍니다 — 새 포지션 등록·청산은 PC에서 daily_check.py가 처리합니다(읽기 전용).</p>' +
      openHtml + closedHtml;
  }

  function sortedFiltered() {
    const q = (document.getElementById('search').value || '').trim().toLowerCase();
    let list = allUsers.filter(u =>
      !q || (u.email || '').toLowerCase().includes(q) || (u.nickname || '').toLowerCase().includes(q)
    );
    list.sort((a, b) => {
      let av, bv;
      if (sortKey === 'createdAt') { av = a.createdAt || ''; bv = b.createdAt || ''; }
      else if (sortKey === 'lastSignInAt') { av = a.lastSignInAt || ''; bv = b.lastSignInAt || ''; }
      else if (sortKey === 'duration') { av = a.stats.totalDurationMs; bv = b.stats.totalDurationMs; }
      else if (sortKey === 'clicks') { av = a.stats.clickCount; bv = b.stats.clickCount; }
      else { av = a.email; bv = b.email; }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return list;
  }

  function thLabel(key, label) {
    const active = sortKey === key;
    const arrow = active ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    return '<th class="' + (active ? 'sorted' : '') + '" onclick="window.__adminSort(\'' + key + '\')">' + label + arrow + '</th>';
  }

  window.__adminSort = function (key) {
    if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = key; sortDir = 'desc'; }
    renderTable();
  };

  window.__adminDelete = async function (id, label) {
    if (!confirm(label + ' 님을 정말 강제 탈퇴시킬까요? 되돌릴 수 없습니다.')) return;
    const session = (await sb.auth.getSession()).data.session;
    const res = await fetch('/api/admin-users?id=' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + session.access_token },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('탈퇴 처리에 실패했습니다: ' + (err.error || res.status));
      return;
    }
    allUsers = allUsers.filter(u => u.id !== id);
    renderTable();
  };

  function renderTable() {
    const list = sortedFiltered();
    document.getElementById('count-badge').textContent = '전체 ' + allUsers.length + '명 중 ' + list.length + '명 표시';

    if (!list.length) {
      document.getElementById('table-wrap').innerHTML = '<div class="empty">표시할 회원이 없습니다.</div>';
      return;
    }

    const rows = list.map(u => {
      const name = u.nickname || u.email.split('@')[0];
      return '<tr>' +
        '<td><div class="nickname">' + name + '<span class="provider-tag">' + (u.provider === 'google' ? '구글' : '이메일') + '</span></div><div class="email">' + u.email + '</div></td>' +
        '<td>' + fmtDate(u.createdAt) + '</td>' +
        '<td>' + fmtDate(u.lastSignInAt) + '</td>' +
        '<td class="stat-num">' + fmtDuration(u.stats.totalDurationMs) + '</td>' +
        '<td class="stat-num">' + u.stats.clickCount + '회</td>' +
        '<td><button class="del-btn" onclick="window.__adminDelete(\'' + u.id + '\', \'' + name.replace(/'/g, "\\'") + '\')">탈퇴</button></td>' +
        '</tr>';
    }).join('');

    document.getElementById('table-wrap').innerHTML =
      '<table><thead><tr>' +
      thLabel('email', '회원') +
      thLabel('createdAt', '가입일') +
      thLabel('lastSignInAt', '최근 로그인') +
      thLabel('duration', '총 체류시간') +
      thLabel('clicks', '클릭 수') +
      '<th>관리</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  loadDashboard();
})();
</script>
</body>
</html>
