<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 · 만조 Investment</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #F7F5F0; --bg-card: #FFFFFF; --bg-hero: #EEE9DF;
    --text-primary: #1C1C2E; --text-secondary: #5A5A72; --text-muted: #9494A8;
    --accent: #4A6FA5; --accent-hover: #3A5A90; --accent-light: #EBF0F9;
    --border: #E5E0D8; --danger: #C0392B; --danger-light: #FBEAE8;
    --font: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text-primary); line-height: 1.6; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
  .back-link { display: inline-block; font-size: 13px; color: var(--text-muted); text-decoration: none; margin-bottom: 14px; }
  .back-link:hover { color: var(--accent); }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 13px; margin: 0 0 28px; }
  .gate, .loading, .error { max-width: 420px; margin: 80px auto; text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 40px 28px; }
  .gate a, .error a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar input[type="search"] { flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 20px; font-family: var(--font); font-size: 14px; outline: none; background: #fff; }
  .toolbar input[type="search"]:focus { border-color: var(--accent); }
  .toolbar select { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 20px; font-family: var(--font); font-size: 13px; background: #fff; color: var(--text-secondary); }
  .count-badge { font-size: 12.5px; color: var(--text-muted); background: var(--accent-light); padding: 4px 12px; border-radius: 12px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  thead th { text-align: left; font-size: 12px; color: var(--text-muted); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--accent); }
  thead th.sorted { color: var(--accent); }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--accent-light); }
  .nickname { font-weight: 700; }
  .email { color: var(--text-secondary); font-size: 12.5px; }
  .provider-tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: var(--bg-hero); color: var(--text-secondary); margin-left: 6px; }
  .stat-num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-muted); }
  .del-btn { background: none; border: 1.5px solid var(--danger); color: var(--danger); border-radius: 14px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: background .15s, color .15s; }
  .del-btn:hover { background: var(--danger); color: #fff; }
  .del-btn:disabled { opacity: .5; cursor: not-allowed; }
  .act-btn { background: none; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 14px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: background .15s, color .15s; }
  .act-btn:hover { background: var(--accent); color: #fff; }
  .act-btn:disabled { opacity: .5; cursor: not-allowed; }
  .hold-grid-head, .hold-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, .8fr) minmax(0, 1.3fr) minmax(0, 1.7fr) minmax(0, 1.4fr); gap: 8px; }
  .hold-grid-head { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .hold-row { margin-bottom: 8px; }
  .hold-row input, .hold-row select { padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 10px; font-family: var(--font); font-size: 13.5px; background: #fff; width: 100%; min-width: 0; }
  .hold-row input:focus, .hold-row select:focus { outline: none; border-color: var(--accent); }
  .hold-row.err input, .hold-row.err select { border-color: var(--danger); background: var(--danger-light); }
  @media (max-width: 900px) {
    .hold-grid-head { display: none; }
    .hold-row { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px; border: 1px dashed var(--border); border-radius: 12px; }
  }
  @media (max-width: 560px) {
    .hold-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .empty { text-align: center; padding: 40px; color: var(--text-muted); }
  .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  .chk { width: 34px; text-align: center; padding-left: 8px !important; padding-right: 4px !important; }
  .chk input { width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }
  .st-select { padding: 6px 8px; border: 1.5px solid var(--border); border-radius: 10px; font-family: var(--font); font-size: 12.5px; background: #fff; cursor: pointer; }
  .st-select:focus { outline: none; border-color: var(--accent); }
  .pos-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 4px 0 10px; font-size: 12.5px; }
  .sell-panel td { background: #FFF8EC; }
  .sell-box { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 2px; font-size: 13px; }
  .sell-box input { padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 10px; font-family: var(--font); font-size: 13px; width: 140px; min-width: 0; background: #fff; }

  .section-h2 { font-size: 16px; font-weight: 800; margin: 0 0 14px; }
  .status-section { margin-bottom: 36px; }
  .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .status-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .status-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .status-card-title { font-size: 14px; font-weight: 700; }
  .status-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
  .status-badge.ok { background: #E4F5EA; color: #1E7A46; }
  .status-badge.warn { background: #FFF3DE; color: #B4740E; }
  .status-badge.error { background: var(--danger-light); color: var(--danger); }
  .status-badge.na { background: var(--bg-hero); color: var(--text-muted); }
  .status-flow { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 10px; word-break: keep-all; }
  .status-flow b { color: var(--text-secondary); font-weight: 600; }
  .status-meta { font-size: 12.5px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 3px; }
  .status-issues { margin: 8px 0 0; padding: 0; list-style: none; font-size: 11.5px; color: var(--danger); }
  .status-issues li { margin-top: 3px; }
  .status-checked-at { font-size: 11.5px; color: var(--text-muted); margin: -8px 0 16px; }
  .heatmap-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .heatmap-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .heatmap-row:last-child { margin-bottom: 0; }
  .heatmap-label { width: 120px; flex-shrink: 0; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .heatmap-cells { display: flex; gap: 6px; }
  .heatmap-cell { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #fff; border: 1.5px dashed var(--border); color: var(--text-muted); }
  .heatmap-cell.filled { background: #2E9E5B; border: 1.5px solid #2E9E5B; color: #fff; }

  .positions-section { margin-bottom: 36px; }
  .ret-pos { color: #1E7A46; font-weight: 700; }
  .ret-neg { color: var(--danger); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">확인 중입니다...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://nxvpipgvcrfkujbvjjak.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54dnBpcGd2Y3Jma3VqYnZqamFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MTA5NTAsImV4cCI6MjA5ODA4Njk1MH0.QXJs2t980WJ_tiXFsFFUWubftHb30r5IpoA1-09qBPk';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const app = document.getElementById('app');
  let allUsers = [];
  let statusData = null;
  let positionsData = [];
  let sortKey = 'createdAt';
  let sortDir = 'desc';

  function showGate() {
    app.innerHTML =
      '<div class="gate">' +
      '<h1 style="margin-bottom:10px">🔒 관리자 전용</h1>' +
      '<p class="sub" style="margin-bottom:20px">회장님 계정으로 로그인해야 볼 수 있는 페이지입니다.</p>' +
      '<a href="/">메인 페이지에서 로그인하러 가기 →</a>' +
      '</div>';
  }

  function showError(msg) {
    app.innerHTML =
      '<div class="error">' +
      '<h1 style="margin-bottom:10px">불러오지 못했습니다</h1>' +
      '<p class="sub">' + msg + '</p>' +
      '<a href="javascript:location.reload()">다시 시도</a>' +
      '&nbsp;·&nbsp;<a href="/">메인으로</a>' +
      '</div>';
  }

  function fmtDate(iso) {
    if (!iso) return '<span class="muted">-</span>';
    const d = new Date(iso);
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0')
      + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function fmtDuration(ms) {
    if (!ms) return '<span class="muted">0분</span>';
    const totalMin = Math.round(ms / 60000);
    if (totalMin < 60) return totalMin + '분';
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h + '시간 ' + m + '분';
  }

  async function loadDashboard() {
    const session = (await sb.auth.getSession()).data.session;
    if (!session) { showGate(); return; }

    const authHeader = { Authorization: 'Bearer ' + session.access_token };
    const [usersRes, statusRes, positionsRes] = await Promise.all([
      fetch('/api/admin-users', { headers: authHeader }),
      fetch('/api/admin-status', { headers: authHeader }),
      fetch('/api/holdings', { headers: authHeader }),
    ]);
    if (usersRes.status === 403) { showGate(); return; }
    if (!usersRes.ok) { showError('회원 목록을 불러오는 중 오류가 발생했습니다 (' + usersRes.status + ').'); return; }

    const data = await usersRes.json();
    allUsers = data.users || [];
    // 현황 대시보드/포지션 현황은 회원 목록보다 덜 치명적이라, 실패해도 페이지 전체를 막지 않고
    // 그 섹션에만 오류를 표시한다(회원 관리 자체는 계속 쓸 수 있어야 하므로).
    statusData = statusRes.ok ? await statusRes.json() : { error: '현황을 불러오지 못했습니다 (' + statusRes.status + ').' };
    if (positionsRes.ok) {
      const h = await positionsRes.json();
      positionsData = h.positions || [];
      requestsData = h.requests || [];
    } else {
      positionsData = [];
    }
    renderApp();
  }

  function renderApp() {
    app.innerHTML =
      '<a href="/" class="back-link">← 메인 페이지로</a>' +
      '<h1>회원 관리</h1>' +
      '<p class="sub">가입한 회원 목록과 사이트 안 활동을 확인하고, 필요하면 강제 탈퇴시킬 수 있습니다.</p>' +
      '<div class="status-section" id="status-section"></div>' +
      '<div class="positions-section" id="positions-section"></div>' +
      '<h2 class="section-h2">회원 목록</h2>' +
      '<div class="toolbar">' +
      '  <input type="search" id="search" placeholder="이메일 또는 닉네임 검색">' +
      '  <span class="count-badge" id="count-badge"></span>' +
      '</div>' +
      '<div id="table-wrap"></div>';
    document.getElementById('search').addEventListener('input', renderTable);
    renderStatus();
    renderPositions();
    renderTable();
  }

  // ── 자동화 현황 대시보드 ──────────────────────────────────────────────────
  const STATUS_LABEL = { ok: '🟢 정상', warn: '🟡 지연', error: '🔴 확인 필요', na: '— 실시간' };
  const WEEKDAY_KR = ['일', '월', '화', '수', '목', '금', '토'];

  function fmtShortDate(iso) {
    if (!iso) return '<span class="muted">데이터 없음</span>';
    return iso.slice(5).replace('-', '/');
  }

  function fmtDaysAgo(days) {
    if (days === null || days === undefined) return '';
    if (days === 0) return '(오늘)';
    if (days < 0) return '(예정)';
    return '(' + days + '일 전)';
  }

  function renderStatus() {
    const el = document.getElementById('status-section');
    if (!el) return;

    if (!statusData) {
      el.innerHTML = '<p class="sub">현황을 불러오는 중입니다...</p>';
      return;
    }
    if (statusData.error) {
      el.innerHTML = '<p class="sub" style="color:var(--danger)">' + statusData.error + '</p>';
      return;
    }

    const cards = statusData.pipelines.map(p => {
      const issuesHtml = p.issues && p.issues.length
        ? '<ul class="status-issues">' + p.issues.map(i => '<li>⚠ ' + i + '</li>').join('') + '</ul>'
        : '';
      const metaHtml = p.status === 'na'
        ? '<div class="status-meta"><span>저장하지 않고 매번 새로 불러옵니다</span></div>'
        : '<div class="status-meta">' +
          '<span>최신: ' + fmtShortDate(p.latestDate) + ' ' + fmtDaysAgo(p.daysSinceLatest) + '</span>' +
          (p.expectedRowCount ? '<span>건수: ' + (p.rowCount == null ? '-' : p.rowCount) + ' / ' + p.expectedRowCount + '</span>' : '') +
          (p.lastUpdatedAt ? '<span>DB 반영: ' + fmtDate(p.lastUpdatedAt) + '</span>' : '') +
          '</div>';

      return '<div class="status-card">' +
        '<div class="status-card-head">' +
        '<span class="status-card-title">' + p.label + '</span>' +
        '<span class="status-badge ' + p.status + '">' + STATUS_LABEL[p.status] + '</span>' +
        '</div>' +
        '<div class="status-flow"><b>출처</b> ' + p.source + ' → <b>주기</b> ' + p.schedule + ' → <b>저장</b> ' + p.table + '</div>' +
        metaHtml +
        issuesHtml +
        '</div>';
    }).join('');

    // 최근 7일 히트맵 (오늘 포함, 과거→오늘 순)
    const today = statusData.today;
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    const heatRows = [
      ['상승률 Top10', statusData.recent7Days.gainers],
      ['거래대금 Top10', statusData.recent7Days.volume],
      ['마켓 스코프', statusData.recent7Days.marketScope],
      ['스크리닝 Top10', statusData.recent7Days.screenerPicks],
    ].map(([label, dateList]) => {
      const set = new Set(dateList);
      const cells = days.map(d => {
        const wd = WEEKDAY_KR[new Date(d + 'T00:00:00Z').getUTCDay()];
        const filled = set.has(d);
        return '<span class="heatmap-cell' + (filled ? ' filled' : '') + '" title="' + d + (filled ? ' 수신됨' : ' 없음') + '">' + wd + '</span>';
      }).join('');
      return '<div class="heatmap-row"><span class="heatmap-label">' + label + '</span><div class="heatmap-cells">' + cells + '</div></div>';
    }).join('');

    el.innerHTML =
      '<h2 class="section-h2">자동화 현황</h2>' +
      '<p class="status-checked-at">확인 시각: ' + fmtDate(statusData.checkedAt) + ' · 상태는 주말·휴장일을 뺀 영업일 기준으로 판단합니다(일간 파이프라인은 1영업일 이내, 스크리닝 Top10(주 1회)은 5영업일 이내를 정상으로 봅니다)</p>' +
      '<div class="status-grid">' + cards + '</div>' +
      '<div class="heatmap-wrap"><div class="status-card-title" style="margin-bottom:12px">최근 7일 수신 현황</div>' + heatRows + '</div>' +
      renderRepairLog(statusData.repairLog);
  }

  // ── 최근 자동 수리 로그 (읽기 전용, repair_log) ──────────────────────────
  // 리서치자동화 저장소의 repair_issues.py가 매일 이슈를 감지·자동 수리한
  // 기록. success=false(=자동으로 못 고쳐서 판단이 필요한 항목)는 강조해서
  // 보여준다 - "로그만 남기고 아무도 안 본다"를 막기 위한 최소한의 가시성.
  const REPAIR_ACTION_LABEL = {
    backfill_rerun: '날짜 공백 재수집', rule_violation_fix: '제외 대상 재구성',
    analysis_retry: '분석 재시도', alert_only: '자동 수리 안 함(확인 필요)',
  };

  function renderRepairLog(log) {
    if (!log) return '';
    if (!log.length) {
      return '<div class="heatmap-wrap" style="margin-top:14px"><div class="status-card-title" style="margin-bottom:8px">최근 자동 수리 로그</div>' +
        '<p class="sub" style="margin:0">최근 기록이 없습니다.</p></div>';
    }
    const rows = log.map(r => {
      const ok = r.success;
      const badge = ok
        ? '<span class="status-badge ok">해결됨</span>'
        : '<span class="status-badge ' + (r.action === 'alert_only' ? 'warn' : 'error') + '">확인 필요</span>';
      return '<div class="heatmap-row" style="align-items:flex-start">' +
        '<span class="heatmap-label" style="width:150px">' + fmtDate(r.checkedAt) + '</span>' +
        '<div style="flex:1;font-size:12.5px;color:var(--text-secondary)">' +
        (r.tradeDate ? r.tradeDate + ' · ' : '') + r.issue +
        '<div class="muted" style="font-size:11px;margin-top:2px">' + (REPAIR_ACTION_LABEL[r.action] || r.action) + '</div>' +
        '</div>' + badge + '</div>';
    }).join('');
    return '<div class="heatmap-wrap" style="margin-top:14px">' +
      '<div class="status-card-title" style="margin-bottom:12px">최근 자동 수리 로그</div>' + rows + '</div>';
  }

  // ── 보유 포지션 현황 (stock_screener.trend_positions 조회 + 등록 요청 접수) ───
  // PC의 positions.py가 관리하는 진짜 추세추종 포지션 원장을 그대로 보여준다.
  // 이 표 자체는 읽기 전용이다. 새 포지션은 아래 "등록 요청"으로 접수함에 넣으면
  // PC가 정식 등록한다(시세 데이터로 align_days/rs120 등을 계산해야 하므로 사이트가
  // 원장에 직접 쓰지 않는다).
  function fmtPct(x) {
    if (x === null || x === undefined) return '<span class="muted">-</span>';
    const pct = (x * 100).toFixed(1) + '%';
    return '<span class="' + (x >= 0 ? 'ret-pos' : 'ret-neg') + '">' + (x >= 0 ? '+' : '') + pct + '</span>';
  }

  function fmtPrice(n) {
    if (n === null || n === undefined) return '<span class="muted">-</span>';
    return Number(n).toLocaleString('ko-KR') + '원';
  }

  // ── 표 행: 선택(삭제용 체크박스) + 상태(보유/관찰/청산 드롭다운) ──────────────
  // 원장에 직접 쓰지 않는다. 상태 변경·청산·삭제도 등록처럼 접수함에 요청으로 쌓이고 PC가 5분 이내에
  // 반영한다(원장 원본이 PC에 있어야 손절·청산 감시가 어긋나지 않기 때문).
  const selectedKeys = new Set();   // 삭제 대상으로 체크한 행: '종목코드|진입일'
  const keyOf = (p) => p.stock_code + '|' + p.entry_date;
  const STATUS_OPTS = [['open', '보유'], ['watch', '관찰'], ['sell', '청산']];

  // 아직 PC가 처리하지 않은 청산·상태 변경·삭제 요청이 있는 종목은 잠가서 요청이 겹치지 않게 한다.
  function pendingByCode() {
    const m = {};
    requestsData.forEach(r => {
      if ((r.status === 'pending' || r.status === 'processing') && r.action && r.action !== 'register') m[r.stock_code] = r;
    });
    return m;
  }
  const pendLabel = (r) => r.action === 'sell' ? '청산 대기' : r.action === 'delete' ? '삭제 대기' : '전환 대기';

  function checkCell(p, pend) {
    const k = keyOf(p);
    return '<td class="chk"><input type="checkbox" data-sel="' + escapeHtml(k) + '"' + (selectedKeys.has(k) ? ' checked' : '') +
      (pend ? ' disabled' : '') + ' aria-label="삭제할 종목으로 선택"></td>';
  }

  function statusCell(p, pend) {
    if (pend) return '<td><span class="status-badge warn">' + pendLabel(pend) + '</span></td>';
    return '<td><select class="st-select" data-status-select data-code="' + p.stock_code + '" data-current="' + p.status + '" aria-label="상태 변경">' +
      STATUS_OPTS.map(o => '<option value="' + o[0] + '"' + (o[0] === p.status ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
      '</select></td>';
  }

  function openPositionRow(p, pend) {
    const unreal = (p.last_price && p.entry_price) ? (p.last_price - p.entry_price) / p.entry_price : null;
    return '<tr data-key="' + escapeHtml(keyOf(p)) + '">' + checkCell(p, pend) +
      '<td><b>' + (p.stock_name || '-') + '</b><div class="email">' + p.stock_code + (p.market_type ? ' · ' + p.market_type : '') + '</div></td>' +
      '<td class="muted">' + (p.entry_date || '-') + '</td>' +
      '<td class="stat-num">' + fmtPrice(p.entry_price) + '</td>' +
      '<td class="stat-num">' + (p.remaining_qty != null ? Number(p.remaining_qty).toLocaleString('ko-KR') : '-') + '</td>' +
      '<td class="stat-num">' + fmtPrice(p.last_price) + '</td>' +
      '<td class="stat-num">' + fmtPct(unreal) + '</td>' +
      '<td class="stat-num">' + (p.align_days != null ? p.align_days + '일' : '-') + '</td>' +
      '<td class="stat-num">' + (p.ma_gap_pct != null ? fmtPct(Number(p.ma_gap_pct) / 100) : '<span class="muted">-</span>') + '</td>' +
      '<td class="muted">' + (p.last_checked || '-') + '</td>' +
      '<td>' + (p.note || '<span class="muted">-</span>') + '</td>' +
      statusCell(p, pend) +
      '</tr>';
  }

  function closedPositionRow(p, pend) {
    return '<tr data-key="' + escapeHtml(keyOf(p)) + '">' + checkCell(p, pend) +
      '<td><b>' + (p.stock_name || '-') + '</b><div class="email">' + p.stock_code + (p.market_type ? ' · ' + p.market_type : '') + '</div></td>' +
      '<td class="muted">' + (p.entry_date || '-') + ' ~ ' + (p.exit_date || '-') + '</td>' +
      '<td class="stat-num">' + fmtPrice(p.entry_price) + ' → ' + fmtPrice(p.exit_price) + '</td>' +
      '<td class="stat-num">' + fmtPct(p.ret) + '</td>' +
      '<td class="muted">' + (p.exit_reason || '-') + '</td>' +
      '<td>' + (p.note || '<span class="muted">-</span>') + '</td>' +
      '</tr>';
  }

  // 섹션 뼈대와 입력 폼은 한 번만 그린다. 이후 갱신(폴링·접수·취소)은 updatePositionData()가
  // 표와 접수 내역만 다시 그려서, 입력 중인 폼이 지워지지 않는다.
  function renderPositions() {
    const el = document.getElementById('positions-section');
    if (!el) return;
    el.innerHTML =
      '<h2 class="section-h2">보유 포지션 현황</h2>' +
      '<p class="sub" style="margin-top:-20px">stock_screener(PC)의 추세추종 포지션 원장을 그대로 보여줍니다 — 등록·상태 변경(보유/관찰/청산)·삭제는 요청으로 접수되고 PC가 5분 이내에 원장에 반영합니다. 실제로 판 종목은 상태를 \'청산\'으로 바꾸고 매도가를 입력하세요.</p>' +
      '<div id="pos-data"></div>' + holdingFormHtml() + '<div id="req-data"></div>';
    bindHoldingForm();
    bindPositionActions();
    lastPositionsSig = null;
    updatePositionData();
  }

  let lastPositionsSig = null;

  function updatePositionData() {
    const posEl = document.getElementById('pos-data');
    const reqEl = document.getElementById('req-data');
    if (!posEl || !reqEl) return;
    const sig = JSON.stringify([positionsData, requestsData]);
    if (sig !== lastPositionsSig) {  // 바뀐 게 없으면 다시 그리지 않는다(펼쳐 둔 '청산 완료' 목록 유지)
      // 청산 입력창이 열려 있는 동안에는 다시 그리지 않는다(입력 중인 매도가가 지워지지 않게) - 닫을 때 다시 갱신한다.
      if (document.querySelector('.sell-panel')) { scheduleRequestPoll(); return; }
      lastPositionsSig = sig;
      renderPositionData(posEl);
      reqEl.innerHTML = requestsHtml();
    }
    scheduleRequestPoll();
  }

  function renderPositionData(el) {
    const open = positionsData.filter(p => p.status === 'open');
    const watch = positionsData.filter(p => p.status === 'watch');
    const closed = positionsData.filter(p => p.status === 'closed');
    const pend = pendingByCode();
    // 더 이상 원장에 없는 행(삭제·정리됨)은 선택 목록에서 뺀다.
    const live = new Set(positionsData.map(keyOf));
    selectedKeys.forEach(k => { if (!live.has(k)) selectedKeys.delete(k); });

    const selAll = '<th class="chk"><input type="checkbox" data-sel-all aria-label="이 표 전체 선택"></th>';
    const head = '<table><thead><tr>' + selAll + '<th>종목</th><th>진입일</th><th>진입가</th><th>잔여수량</th><th>현재가</th><th>평가손익</th><th>정배열</th><th title="현재가가 20일 이동평균선보다 몇 % 위(+)·아래(-)에 있는지. 마이너스면 20일선 아래입니다.">20일선 대비</th><th>최근확인</th><th>메모</th><th title="보유: 손절·청산 규칙 적용 / 관찰: 자동 청산 안 함 / 청산: 직접 매도했을 때 선택(매도가 입력)">상태</th></tr></thead><tbody>';

    const toolbar = positionsData.length
      ? '<div class="pos-toolbar"><span id="sel-count" class="muted">선택 0개</span>' +
        '<button type="button" id="sel-delete" class="del-btn" disabled>선택 삭제</button>' +
        '<span id="pos-msg" style="font-size:12.5px"></span></div>'
      : '';

    const openHtml = open.length
      ? '<div class="tbl-scroll">' + head + open.map(p => openPositionRow(p, pend[p.stock_code])).join('') + '</tbody></table></div>'
      : '<div class="empty">' + (watch.length ? '손절·청산 규칙이 적용되는 보유 종목은 없습니다.' : '현재 보유(진행) 중인 포지션이 없습니다.') + '</div>';

    // 관찰 전용: 현재가·손익은 매일 갱신하지만 손절 등으로 자동 청산하지 않는다. 매도 여부는 직접 판단.
    const watchHtml = watch.length
      ? '<div class="status-card-title" style="margin:18px 0 4px">관찰 중 ' + watch.length + '종목 <span class="status-badge na" style="margin-left:6px">자동 청산 안 함</span></div>' +
        '<p class="sub" style="margin:0 0 10px;font-size:12px">현재가·평가손익은 매일 갱신되지만, 손절선(-7%)에 닿아도 장부에서 청산 처리하지 않습니다. 언제 팔지는 직접 판단하세요.</p>' +
        '<div class="tbl-scroll">' + head + watch.map(p => openPositionRow(p, pend[p.stock_code])).join('') + '</tbody></table></div>'
      : '';

    const closedHtml = closed.length
      ? '<details style="margin-top:14px"><summary style="cursor:pointer;font-size:13px;color:var(--text-muted)">청산 완료 ' + closed.length + '건 보기</summary>' +
        '<p class="sub" style="margin:8px 0 0;font-size:11.5px">※ 장부(원장) 기준 기록입니다. 규칙상 청산 신호가 나면 장부에서만 청산 처리되므로, 실제 매도 여부와 다를 수 있습니다.</p>' +
        '<div class="tbl-scroll"><table style="margin-top:10px"><thead><tr>' + selAll + '<th>종목</th><th>진입~청산일</th><th>진입가→청산가</th><th>손익률</th><th>청산사유</th><th>메모</th></tr></thead><tbody>' +
        closed.map(p => closedPositionRow(p, pend[p.stock_code])).join('') + '</tbody></table></div></details>'
      : '';

    el.innerHTML = toolbar + openHtml + watchHtml + closedHtml;
    refreshSelectionUi();
    if (lastPosMsg) posSay(lastPosMsg.text, lastPosMsg.ok);
  }

  // ── 보유 종목 등록 요청 (접수함: stock_screener.position_requests) ────────────
  // 원장에 직접 쓰지 않는다. 접수된 요청은 PC의 TrendPositionIntake 작업(5분마다)이
  // 원장(positions.csv)에 정식 등록하고 결과를 status/message로 돌려준다. 원본이 PC에
  // 있어야 손절·청산 감시가 정상 작동하기 때문이다(2026-10-02).
  const REQ_STATUS = {
    pending: ['대기', 'warn'], processing: ['처리 중', 'warn'], done: ['등록됨', 'ok'],
    error: ['실패', 'error'], cancelled: ['취소', 'na'],
  };
  let requestsData = [];
  let reqPollTimer = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // 입력 행: 처음엔 3행이 보이고 "행 추가"로 최대 10행까지 늘린다. 엑셀·메모에서 여러 줄을 복사해
  // 종목코드 칸에 붙여넣으면 줄마다 한 행씩 채워진다(import_holdings.py의 입력 형식과 같음).
  const HOLD_START_ROWS = 3;
  const HOLD_MAX_ROWS = 10;
  const HOLD_MODES = [['import', '이미 보유 중(편입)'], ['watch', '관찰 전용(자동 청산 안 함)'], ['new', '방금 새로 매수']];

  function holdingRowHtml() {
    return '<div class="hold-row" data-row>' +
      '<input data-f="stockCode" inputmode="numeric" maxlength="6" placeholder="종목코드" aria-label="종목코드">' +
      '<input data-f="entryPrice" inputmode="decimal" placeholder="매수가(원)" aria-label="매수가">' +
      '<input data-f="quantity" inputmode="decimal" placeholder="수량(선택)" aria-label="수량">' +
      '<input data-f="entryDate" type="date" aria-label="최초 매수일(선택)" title="최초 매수일(선택)">' +
      '<select data-f="mode" aria-label="구분">' + HOLD_MODES.map(m => '<option value="' + m[0] + '">' + m[1] + '</option>').join('') + '</select>' +
      '<input data-f="note" maxlength="200" placeholder="메모(선택)" aria-label="메모">' +
      '</div>';
  }

  function holdingFormHtml() {
    return '<div class="heatmap-wrap" style="margin-top:18px">' +
      '<div class="status-card-title" style="margin-bottom:4px">보유 종목 등록 요청</div>' +
      '<p class="sub" style="margin:0 0 12px">PC가 5분 이내에 정식 등록합니다. 매수가는 실제 체결가(평균 매수가)를 넣어주세요. 종목코드·매수가는 필수입니다.</p>' +
      '<form id="holding-form" autocomplete="off">' +
      '<div class="hold-grid-head"><span>종목코드 *</span><span>매수가(원) *</span><span>수량</span><span>최초 매수일</span><span>구분</span><span>메모</span></div>' +
      '<div id="hold-rows">' + Array.from({ length: HOLD_START_ROWS }, holdingRowHtml).join('') + '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px">' +
      '<button type="button" id="hold-add" class="act-btn" style="padding:7px 14px">+ 행 추가</button>' +
      '<button type="button" id="hold-clear" class="act-btn" style="padding:7px 14px">비우기</button>' +
      '<span id="hold-count" class="muted" style="font-size:12px"></span>' +
      '<button type="submit" id="holding-submit" class="act-btn" style="margin-left:auto">등록 요청</button>' +
      '</div></form>' +
      '<div id="holding-msg" style="font-size:12.5px;margin-top:10px;min-height:18px"></div>' +
      '<p class="sub" style="margin:8px 0 0;font-size:11.5px">※ 엑셀·메모에서 여러 줄을 복사해 종목코드 칸에 붙여넣으면 한 번에 채워집니다(종목코드 매수가 수량 매수일 메모 순서, 칸은 탭 또는 공백으로 구분).<br>' +
      '※ "최초 매수일"은 처음 산 날짜를 적으세요(물타기한 날짜 X). 비워두면 최근 시세일로 잡히고, 최대 보유기간(60거래일)은 등록일부터 셉니다.<br>' +
      '※ <b>관찰 전용</b>은 현재가·손익만 매일 갱신하고 손절선(-7%)에 닿아도 자동 청산하지 않습니다. 이미 손절선 아래인 종목을 지켜볼 때 고르세요(나머지 구분은 손절선 아래면 다음 점검에서 바로 청산 처리됩니다).</p>' +
      '</div>';
  }

  function requestRow(r) {
    const act = r.action || 'register';
    let [label, cls] = REQ_STATUS[r.status] || [r.status, 'na'];
    if (act !== 'register' && r.status === 'done') label = '처리됨';
    const cancel = r.status === 'pending'
      ? ' <button type="button" class="del-btn" data-cancel="' + r.id + '" style="padding:2px 9px;font-size:11px">취소</button>' : '';
    const won = (n) => Number(n).toLocaleString('ko-KR') + '원';
    const detail = act === 'sell'
      ? '청산(전량 매도) · 매도가 ' + won(r.exit_price) + (r.exit_date ? ' · ' + r.exit_date : '')
      : act === 'set_status' ? (r.target_status === 'watch' ? '관찰로 전환' : '보유로 전환')
      : act === 'delete' ? '원장에서 삭제 · 진입일 ' + r.entry_date
      : (r.mode === 'new' ? '신규 매수' : r.mode === 'watch' ? '관찰 전용' : '기존 보유') + ' · ' + won(r.entry_price) +
        (r.quantity != null ? ' · ' + Number(r.quantity).toLocaleString('ko-KR') + '주' : '') +
        (r.entry_date ? ' · ' + r.entry_date : '');
    return '<div class="heatmap-row" style="align-items:flex-start">' +
      '<span class="heatmap-label" style="width:150px">' + fmtDate(r.created_at) + '</span>' +
      '<div style="flex:1;font-size:12.5px;color:var(--text-secondary)">' +
      (r.stock_name
        ? '<b>' + escapeHtml(r.stock_name) + '</b> <span class="muted">' + escapeHtml(r.stock_code) + '</span>'
        : '<b>' + escapeHtml(r.stock_code) + '</b>') + ' · ' + escapeHtml(detail) +
      (r.message ? '<div class="muted" style="font-size:11.5px;margin-top:2px">' + escapeHtml(r.message) + '</div>' : '') +
      '</div><span class="status-badge ' + cls + '">' + label + '</span>' + cancel + '</div>';
  }

  function requestsHtml() {
    if (!requestsData.length) return '';
    return '<div class="heatmap-wrap" style="margin-top:14px">' +
      '<div class="status-card-title" style="margin-bottom:12px">요청 내역</div>' +
      '<div id="requests-list">' + requestsData.map(requestRow).join('') + '</div></div>';
  }

  // ── 표 조작: 체크박스로 선택·삭제, 상태 드롭다운(보유/관찰/청산), 청산 입력창 ──────────
  let lastPosMsg = null;
  const wonFmt = (n) => Number(n).toLocaleString('ko-KR') + '원';
  const activePos = (code) => positionsData.find(p => p.stock_code === code && (p.status === 'open' || p.status === 'watch'));

  function posSay(text, ok) {
    lastPosMsg = text ? { text, ok } : null;
    const el = document.getElementById('pos-msg');
    if (el) { el.style.color = ok ? '#1E7A46' : 'var(--danger)'; el.textContent = text || ''; }
  }

  function refreshSelectionUi() {
    const n = selectedKeys.size;
    const c = document.getElementById('sel-count');
    if (c) c.textContent = '선택 ' + n + '개';
    const b = document.getElementById('sel-delete');
    if (b) b.disabled = n === 0;
    document.querySelectorAll('[data-sel-all]').forEach(all => {
      const boxes = Array.from(all.closest('table').querySelectorAll('[data-sel]:not(:disabled)'));
      all.checked = boxes.length > 0 && boxes.every(x => x.checked);
      all.indeterminate = boxes.some(x => x.checked) && !all.checked;
    });
  }

  async function postAction(body) {
    const res = await fetch('/api/holdings', {
      method: 'POST', headers: { ...(await authHeaders()), 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ('요청 실패 (' + res.status + ')'));
    return out;
  }

  function closeSellPanel(panel, refresh = true) {
    if (!panel) return;
    const code = panel.dataset.code;
    panel.remove();
    const sel = document.querySelector('[data-status-select][data-code="' + code + '"]');
    const p = activePos(code);
    if (sel && p) sel.value = p.status;     // 입력을 취소했으니 드롭다운을 원래 상태로 되돌린다
    if (refresh) updatePositionData();      // 열려 있는 동안 미뤄 둔 갱신을 반영한다
  }

  function openSellPanel(tr, p) {
    const panel = document.createElement('tr');
    panel.className = 'sell-panel';
    panel.dataset.code = p.stock_code;
    panel.dataset.entry = p.entry_price;
    panel.innerHTML = '<td colspan="' + tr.children.length + '"><div class="sell-box">' +
      '<span><b>' + escapeHtml(p.stock_name) + '</b> 청산(전량 매도) — 실제로 판 가격을 입력하세요</span>' +
      '<input data-sell-price inputmode="decimal" placeholder="매도가(원) *" aria-label="매도가">' +
      '<input data-sell-date type="date" title="매도일(비우면 오늘)" aria-label="매도일">' +
      '<button type="button" class="act-btn" data-sell-submit style="padding:7px 14px">청산 요청</button>' +
      '<button type="button" class="del-btn" data-sell-cancel style="padding:6px 12px">취소</button>' +
      '<span class="muted" data-sell-preview style="font-size:12px">매수가 ' + wonFmt(p.entry_price) + ' 대비 손익이 기록됩니다.</span>' +
      '</div></td>';
    tr.after(panel);
    panel.querySelector('[data-sell-price]').focus();
  }

  async function submitSell(panel) {
    const code = panel.dataset.code;
    const p = activePos(code);
    const price = Number(panel.querySelector('[data-sell-price]').value.replace(/,/g, ''));
    if (!(price > 0)) { posSay('매도가를 올바른 숫자로 입력하세요.', false); return; }
    const date = panel.querySelector('[data-sell-date]').value;
    const ret = p ? (price / Number(p.entry_price) - 1) * 100 : null;
    if (!confirm((p ? p.stock_name : code) + ' 청산을 기록합니다.\n\n매도가 ' + wonFmt(price) + (date ? ' · 매도일 ' + date : ' · 매도일 오늘') +
        (ret !== null ? '\n매수가 대비 ' + (ret >= 0 ? '+' : '') + ret.toFixed(1) + '%' : '') +
        '\n\n※ 전량 매도로 기록되며, 되돌리려면 PC 명령이 필요합니다. 계속할까요?')) return;
    const btn = panel.querySelector('[data-sell-submit]');
    btn.disabled = true;
    try {
      await postAction({ action: 'sell', stockCode: code, exitPrice: price, exitDate: date });
      panel.remove();
      await reloadHoldings();
      posSay((p ? p.stock_name : code) + ' 청산 요청을 접수했습니다. PC가 5분 이내에 반영합니다.', true);
      updatePositionData();
    } catch (e) {
      posSay(e.message, false);
      btn.disabled = false;
    }
  }

  async function handleStatusChange(sel) {
    const code = sel.dataset.code, current = sel.dataset.current, v = sel.value;
    const p = activePos(code);
    document.querySelectorAll('.sell-panel').forEach(pn => closeSellPanel(pn, false));  // 다른 행의 열린 입력창은 닫는다
    if (!p || v === current) { sel.value = current; return; }
    if (v === 'sell') { openSellPanel(sel.closest('tr'), p); return; }

    const msg = v === 'watch'
      ? p.stock_name + '을(를) \'관찰\'로 바꿉니다.\n손절선(-7%)에 닿아도 장부에서 자동 청산하지 않습니다. 계속할까요?'
      : p.stock_name + '을(를) \'보유\'로 바꿉니다.\n손절·청산 규칙이 다시 적용됩니다. 현재가가 이미 손절선(-7%) 아래면 다음 점검에서 바로 청산 처리됩니다. 계속할까요?';
    if (!confirm(msg)) { sel.value = current; return; }
    sel.disabled = true;
    try {
      await postAction({ action: 'set_status', stockCode: code, targetStatus: v });
      await reloadHoldings();
      posSay(p.stock_name + ' 상태 변경을 접수했습니다. PC가 5분 이내에 반영합니다.', true);
      updatePositionData();
    } catch (e) {
      posSay(e.message, false);
      sel.value = current;
      sel.disabled = false;
    }
  }

  async function deleteSelected() {
    const rows = Array.from(selectedKeys).map(k => positionsData.find(p => keyOf(p) === k)).filter(Boolean);
    if (!rows.length) return;
    const label = (p) => p.status === 'open' ? '보유' : p.status === 'watch' ? '관찰' : '청산 완료';
    if (!confirm(rows.length + '개 항목을 원장에서 삭제합니다.\n\n' +
        rows.map(p => '· ' + p.stock_name + ' (' + label(p) + ', 진입일 ' + p.entry_date + ')').join('\n') +
        '\n\n※ 삭제는 \'매도 기록\'이 아니라 장부에서 지우는 것입니다(보유·관찰 종목이면 이후 감시도 사라집니다).' +
        '\n※ 실행 전에 PC에서 원장 백업이 만들어집니다. 계속할까요?')) return;
    const btn = document.getElementById('sel-delete');
    if (btn) btn.disabled = true;
    try {
      await postAction({ action: 'delete', items: rows.map(p => ({ stockCode: p.stock_code, entryDate: p.entry_date })) });
      rows.forEach(p => selectedKeys.delete(keyOf(p)));
      await reloadHoldings();
      posSay(rows.length + '건 삭제 요청을 접수했습니다. PC가 5분 이내에 처리합니다.', true);
      updatePositionData();
    } catch (e) {
      posSay(e.message, false);
      refreshSelectionUi();
    }
  }

  function bindPositionActions() {
    const root = document.getElementById('positions-section');
    root.addEventListener('change', (ev) => {
      const t = ev.target;
      if (t.matches('[data-sel]')) {
        if (t.checked) selectedKeys.add(t.dataset.sel); else selectedKeys.delete(t.dataset.sel);
        refreshSelectionUi();
      } else if (t.matches('[data-sel-all]')) {
        t.closest('table').querySelectorAll('[data-sel]:not(:disabled)').forEach(b => {
          b.checked = t.checked;
          if (t.checked) selectedKeys.add(b.dataset.sel); else selectedKeys.delete(b.dataset.sel);
        });
        refreshSelectionUi();
      } else if (t.matches('[data-status-select]')) {
        handleStatusChange(t);
      }
    });
    root.addEventListener('click', (ev) => {
      const t = ev.target;
      if (t.closest('#sel-delete')) deleteSelected();
      else if (t.closest('[data-sell-submit]')) submitSell(t.closest('.sell-panel'));
      else if (t.closest('[data-sell-cancel]')) closeSellPanel(t.closest('.sell-panel'));
    });
    root.addEventListener('input', (ev) => {   // 매도가를 입력하는 동안 예상 수익률을 보여준다
      if (!ev.target.matches('[data-sell-price]')) return;
      const panel = ev.target.closest('.sell-panel');
      const price = Number(ev.target.value.replace(/,/g, ''));
      const entry = Number(panel.dataset.entry);
      const el = panel.querySelector('[data-sell-preview]');
      el.textContent = price > 0
        ? '매수가 ' + wonFmt(entry) + ' 대비 ' + ((price / entry - 1) * 100 >= 0 ? '+' : '') + ((price / entry - 1) * 100).toFixed(1) + '%'
        : '매수가 ' + wonFmt(entry) + ' 대비 손익이 기록됩니다.';
    });
  }

  async function authHeaders() {
    const session = (await sb.auth.getSession()).data.session;
    if (!session) throw new Error('로그인이 만료됐습니다. 새로고침해 주세요.');
    return { Authorization: 'Bearer ' + session.access_token };
  }

  async function reloadHoldings() {
    const res = await fetch('/api/holdings', { headers: await authHeaders() });
    if (!res.ok) throw new Error('불러오지 못했습니다 (' + res.status + ')');
    const data = await res.json();
    positionsData = data.positions || [];
    requestsData = data.requests || [];
  }

  // 대기/처리 중인 요청이 있는 동안만 20초마다 상태를 다시 확인한다(등록 완료되면 목록도 갱신).
  function scheduleRequestPoll() {
    clearTimeout(reqPollTimer);
    if (!requestsData.some(r => r.status === 'pending' || r.status === 'processing')) return;
    reqPollTimer = setTimeout(async () => {
      try { await reloadHoldings(); } catch (e) { /* 다음 주기에 다시 */ }
      updatePositionData();  // 안에서 다음 폴링을 다시 예약한다
    }, 20000);
  }

  function bindHoldingForm() {
    const form = document.getElementById('holding-form');
    if (!form) return;
    const msg = document.getElementById('holding-msg');
    const say = (text, ok) => { msg.style.color = ok ? '#1E7A46' : 'var(--danger)'; msg.textContent = text; };

    const rowsEl = document.getElementById('hold-rows');
    const addBtn = document.getElementById('hold-add');
    const countEl = document.getElementById('hold-count');
    const rowEls = () => Array.from(rowsEl.querySelectorAll('[data-row]'));
    const field = (row, f) => row.querySelector('[data-f="' + f + '"]');
    const rowValues = (row) => ({
      stockCode: field(row, 'stockCode').value.trim(), entryPrice: field(row, 'entryPrice').value.trim(),
      quantity: field(row, 'quantity').value.trim(), entryDate: field(row, 'entryDate').value.trim(),
      mode: field(row, 'mode').value, note: field(row, 'note').value.trim(),
    });
    const isBlank = (v) => !v.stockCode && !v.entryPrice && !v.quantity && !v.entryDate && !v.note;

    function refreshRowControls() {
      const n = rowEls().length;
      addBtn.disabled = n >= HOLD_MAX_ROWS;
      countEl.textContent = n + '/' + HOLD_MAX_ROWS + '행';
    }
    function ensureRows(n) {
      while (rowEls().length < Math.min(n, HOLD_MAX_ROWS)) rowsEl.insertAdjacentHTML('beforeend', holdingRowHtml());
      refreshRowControls();
    }
    function resetRows() {
      rowsEl.innerHTML = Array.from({ length: HOLD_START_ROWS }, holdingRowHtml).join('');
      refreshRowControls();
    }
    function markRow(row, bad) { if (row) row.classList.toggle('err', !!bad); }
    refreshRowControls();

    addBtn.addEventListener('click', () => { ensureRows(rowEls().length + 1); });
    document.getElementById('hold-clear').addEventListener('click', () => { resetRows(); say('', true); });
    rowsEl.addEventListener('input', (ev) => markRow(ev.target.closest('[data-row]'), false));

    // 엑셀·메모에서 복사한 여러 줄을 종목코드 칸에 붙여넣으면 줄마다 한 행씩 채운다.
    const isDateTok = (t) => /^\d{4}[-./]?\d{2}[-./]?\d{2}$/.test(t);
    const normDate = (t) => { const d = t.replace(/[-./]/g, ''); return d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8); };
    function parsePasteLine(line) {
      let code, price, qty = '', date = '', note = '';
      if (line.includes('\t')) {           // 엑셀: 빈 칸도 자리를 지킨다
        const c = line.split('\t').map(s => s.trim());
        [code, price, qty = '', date = ''] = c;
        note = c.slice(4).join(' ').trim();
        if (isDateTok(qty) && !date) { date = qty; qty = ''; }
      } else {                              // 공백 구분: import_holdings.py와 같은 규칙
        const t = line.trim().split(/\s+/);
        [code, price] = t;
        let rest = t.slice(2);
        if (rest.length && !isDateTok(rest[0]) && /^[\d,.]+$/.test(rest[0])) { qty = rest[0]; rest = rest.slice(1); }
        if (rest.length && isDateTok(rest[0])) { date = rest[0]; rest = rest.slice(1); }
        note = rest.join(' ');
      }
      code = String(code || '').replace(/\D/g, '');
      if (!code) return null;
      return {
        stockCode: code.padStart(6, '0'), entryPrice: String(price || '').replace(/,/g, ''),
        quantity: String(qty || '').replace(/,/g, ''), entryDate: isDateTok(date) ? normDate(date) : '', note,
      };
    }
    rowsEl.addEventListener('paste', (ev) => {
      const target = ev.target;
      if (!target || target.dataset.f !== 'stockCode') return;
      const text = (ev.clipboardData || window.clipboardData).getData('text');
      if (!/[\r\n\t]/.test(text.trim())) return;   // 한 칸짜리 붙여넣기는 그대로 둔다
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
      const parsed = lines.map(parsePasteLine).filter(Boolean);
      if (!parsed.length) return;
      ev.preventDefault();
      const start = rowEls().indexOf(target.closest('[data-row]'));
      ensureRows(start + parsed.length);
      const rows = rowEls();
      const room = rows.length - start;
      parsed.slice(0, room).forEach((p, k) => {
        const r = rows[start + k];
        ['stockCode', 'entryPrice', 'quantity', 'entryDate', 'note'].forEach(f => { field(r, f).value = p[f]; });
        markRow(r, false);
      });
      if (parsed.length > room) say('붙여넣은 ' + parsed.length + '줄 중 ' + room + '줄만 들어갔습니다(최대 ' + HOLD_MAX_ROWS + '행).', false);
      else say(parsed.length + '줄을 채웠습니다. 내용을 확인하고 "등록 요청"을 누르세요.', true);
    });

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById('holding-submit');
      const rows = rowEls();
      rows.forEach(r => markRow(r, false));
      const picked = [];  // { n: 화면의 행 번호, row: 요소, v: 값 }
      rows.forEach((row, idx) => { const v = rowValues(row); if (!isBlank(v)) picked.push({ n: idx + 1, row, v }); });
      if (!picked.length) { say('등록할 종목을 입력해 주세요.', false); return; }

      // 서버가 같은 검사를 다시 하지만, 화면의 행 번호로 바로 알려주려고 먼저 확인한다.
      for (const p of picked) {
        const bad = !/^\d{6}$/.test(p.v.stockCode) ? '종목코드는 숫자 6자리여야 합니다.'
          : !(Number(p.v.entryPrice.replace(/,/g, '')) > 0) ? '매수가를 올바른 숫자로 입력하세요.'
          : (p.v.quantity !== '' && !(Number(p.v.quantity.replace(/,/g, '')) > 0)) ? '수량을 올바른 숫자로 입력하세요.' : '';
        if (bad) { markRow(p.row, true); say(p.n + '행: ' + bad, false); return; }
      }

      btn.disabled = true;
      try {
        const res = await fetch('/api/holdings', {
          method: 'POST',
          headers: { ...(await authHeaders()), 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: picked.map(p => p.v) }),
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) {
          // 서버가 알려주는 행(row)은 보낸 목록 기준이라 화면의 행 번호로 바꿔 보여준다.
          const hit = Number.isInteger(out.row) ? picked[out.row] : null;
          if (hit) markRow(hit.row, true);
          const msgText = String(out.error || ('접수 실패 (' + res.status + ')')).replace(/^\d+행:\s*/, '');
          throw new Error((hit ? hit.n + '행: ' : '') + msgText);
        }
        await reloadHoldings();
        resetRows();
        say(picked.length + '건 접수됐습니다. PC가 5분 이내에 원장에 등록합니다.', true);
        updatePositionData();
      } catch (e) {
        say(e.message, false);
      } finally {
        btn.disabled = false;
      }
    });

    // 취소 버튼은 접수 내역이 다시 그려질 때마다 새로 생기므로, 고정 컨테이너에서 위임 처리한다.
    document.getElementById('positions-section').addEventListener('click', async (ev) => {
      const b = ev.target.closest('[data-cancel]');
      if (!b) return;
      b.disabled = true;
      try {
        const res = await fetch('/api/holdings?id=' + encodeURIComponent(b.dataset.cancel), {
          method: 'DELETE', headers: await authHeaders(),
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || ('취소 실패 (' + res.status + ')'));
        await reloadHoldings();
        say('요청을 취소했습니다.', true);
        updatePositionData();
      } catch (e) {
        say(e.message, false);
        b.disabled = false;
      }
    });
  }

  function sortedFiltered() {
    const q = (document.getElementById('search').value || '').trim().toLowerCase();
    let list = allUsers.filter(u =>
      !q || (u.email || '').toLowerCase().includes(q) || (u.nickname || '').toLowerCase().includes(q)
    );
    list.sort((a, b) => {
      let av, bv;
      if (sortKey === 'createdAt') { av = a.createdAt || ''; bv = b.createdAt || ''; }
      else if (sortKey === 'lastSignInAt') { av = a.lastSignInAt || ''; bv = b.lastSignInAt || ''; }
      else if (sortKey === 'duration') { av = a.stats.totalDurationMs; bv = b.stats.totalDurationMs; }
      else if (sortKey === 'clicks') { av = a.stats.clickCount; bv = b.stats.clickCount; }
      else { av = a.email; bv = b.email; }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return list;
  }

  function thLabel(key, label) {
    const active = sortKey === key;
    const arrow = active ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    return '<th class="' + (active ? 'sorted' : '') + '" onclick="window.__adminSort(\'' + key + '\')">' + label + arrow + '</th>';
  }

  window.__adminSort = function (key) {
    if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = key; sortDir = 'desc'; }
    renderTable();
  };

  window.__adminDelete = async function (id, label) {
    if (!confirm(label + ' 님을 정말 강제 탈퇴시킬까요? 되돌릴 수 없습니다.')) return;
    const session = (await sb.auth.getSession()).data.session;
    const res = await fetch('/api/admin-users?id=' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + session.access_token },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('탈퇴 처리에 실패했습니다: ' + (err.error || res.status));
      return;
    }
    allUsers = allUsers.filter(u => u.id !== id);
    renderTable();
  };

  function renderTable() {
    const list = sortedFiltered();
    document.getElementById('count-badge').textContent = '전체 ' + allUsers.length + '명 중 ' + list.length + '명 표시';

    if (!list.length) {
      document.getElementById('table-wrap').innerHTML = '<div class="empty">표시할 회원이 없습니다.</div>';
      return;
    }

    const rows = list.map(u => {
      const name = u.nickname || u.email.split('@')[0];
      return '<tr>' +
        '<td><div class="nickname">' + name + '<span class="provider-tag">' + (u.provider === 'google' ? '구글' : '이메일') + '</span></div><div class="email">' + u.email + '</div></td>' +
        '<td>' + fmtDate(u.createdAt) + '</td>' +
        '<td>' + fmtDate(u.lastSignInAt) + '</td>' +
        '<td class="stat-num">' + fmtDuration(u.stats.totalDurationMs) + '</td>' +
        '<td class="stat-num">' + u.stats.clickCount + '회</td>' +
        '<td><button class="del-btn" onclick="window.__adminDelete(\'' + u.id + '\', \'' + name.replace(/'/g, "\\'") + '\')">탈퇴</button></td>' +
        '</tr>';
    }).join('');

    document.getElementById('table-wrap').innerHTML =
      '<div class="tbl-scroll"><table><thead><tr>' +
      thLabel('email', '회원') +
      thLabel('createdAt', '가입일') +
      thLabel('lastSignInAt', '최근 로그인') +
      thLabel('duration', '총 체류시간') +
      thLabel('clicks', '클릭 수') +
      '<th>관리</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  loadDashboard();
})();
</script>
</body>
